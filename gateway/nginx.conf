worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Resolver interno de Docker: los upstreams se resuelven en cada petición,
    # así el gateway arranca y sigue respondiendo aunque un servicio esté caído.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------- Rate limiting ----------
    limit_req_zone  $binary_remote_addr zone=global:10m   rate=40r/s;
    limit_req_zone  $binary_remote_addr zone=login:12m    rate=20r/m;
    limit_req_zone  $binary_remote_addr zone=catalogo:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ---------- WAF básico (URI, query string y cabeceras) ----------
    map $request_uri $waf_uri {
        default 0;
        "~*union(\+|%20|\s|/\*.*?\*/)+(all(\+|%20|\s)+)?select" 1;
        "~*(sleep|benchmark|load_file|extractvalue|updatexml)(\s|%20)*(\(|%28)" 1;
        "~*information_schema" 1;
        "~*(%27|')(\+|%20|\s)*(or|and)(\+|%20|\s)+(%27|'|\d)" 1;
        "~*(;|%3B)(\s|%20)*(drop|delete|truncate|insert|update)(\s|%20)" 1;
        "~*(<|%3C)(\s|%20)*script" 1;
        "~*javascript(:|%3A)" 1;
        "~*on(error|load|mouseover|focus)(\s|%20)*(=|%3D)" 1;
        "~*(\.\./|\.\.%2f|%2e%2e%2f|%2e%2e/)" 1;
        "~*(/etc/passwd|/proc/self|cmd\.exe|/bin/sh)" 1;
    }
    map $http_user_agent $waf_ua {
        default 0;
        "~*(sqlmap|nikto|nmap|masscan|acunetix|havij|dirbuster)" 1;
        "~*(<|%3C)(\s|%20)*script" 1;
        "~*union(\s|%20)+select" 1;
    }
    map $http_referer $waf_ref {
        default 0;
        "~*(<|%3C)(\s|%20)*script" 1;
        "~*union(\s|%20)+select" 1;
    }
    map "$waf_uri$waf_ua$waf_ref" $waf_block {
        default 1;
        "000"   0;
    }

    log_format seguridad '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_user_agent" rid=$request_id waf=$waf_block';
    access_log /var/log/nginx/access.log seguridad;

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://res.cloudinary.com; connect-src 'self' https://api.cloudinary.com; frame-src https://maps.google.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Request-ID $request_id always;

        if ($waf_block) {
            return 403;
        }

        error_page 429 = @limite_excedido;
        error_page 502 503 504 = @servicio_no_disponible;
        location @limite_excedido {
            default_type application/json;
            return 429 '{"error":"Demasiadas solicitudes. Espera un momento e intenta de nuevo."}';
        }
        location @servicio_no_disponible {
            default_type application/json;
            return 503 '{"error":"Servicio temporalmente no disponible"}';
        }

        # Endpoints internos entre microservicios: nunca accesibles desde Internet.
        location ~ ^/api/[a-z]+/interno(/|$) {
            return 404;
        }

        # ---------- auth-service ----------
        location = /api/auth/login {
            limit_req zone=login burst=8 nodelay;
            limit_req zone=global burst=80 nodelay;
            limit_except POST { deny all; }
            set $auth_upstream auth-service:8081;
            rewrite ^ /login break;
            proxy_pass http://$auth_upstream;
            include /etc/nginx/proxy.conf;
        }

        location /api/auth/ {
            limit_req zone=global burst=80 nodelay;
            set $auth_upstream auth-service:8081;
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://$auth_upstream;
            include /etc/nginx/proxy.conf;
        }

        # ---------- catalogo-service (rate limit propio contra scraping) ----------
        location /api/catalogo/ {
            limit_req zone=catalogo burst=60 nodelay;
            limit_req zone=global burst=80 nodelay;
            set $catalogo_upstream catalogo-service:8082;
            rewrite ^/api/catalogo/(.*)$ /$1 break;
            proxy_pass http://$catalogo_upstream;
            include /etc/nginx/proxy.conf;
        }

        # ---------- pedidos-service ----------
        location /api/pedidos/ {
            limit_req zone=global burst=80 nodelay;
            set $pedidos_upstream pedidos-service:8083;
            rewrite ^/api/pedidos/(.*)$ /$1 break;
            proxy_pass http://$pedidos_upstream;
            include /etc/nginx/proxy.conf;
        }

        # ---------- pagos-service (webhook sin JWT; autenticado por Stripe-Signature) ----------
        location = /api/pagos/webhook {
            limit_req zone=global burst=80 nodelay;
            limit_except POST { deny all; }
            set $pagos_upstream pagos-service:8084;
            rewrite ^ /webhook break;
            proxy_pass http://$pagos_upstream;
            include /etc/nginx/proxy.conf;
        }

        location /api/pagos/ {
            limit_req zone=global burst=80 nodelay;
            set $pagos_upstream pagos-service:8084;
            rewrite ^/api/pagos/(.*)$ /$1 break;
            proxy_pass http://$pagos_upstream;
            include /etc/nginx/proxy.conf;
        }

        # ---------- notificaciones / clima ----------
        location /api/notificaciones/ {
            limit_req zone=global burst=80 nodelay;
            set $notif_upstream notificaciones-service:8085;
            rewrite ^/api/notificaciones/(.*)$ /$1 break;
            proxy_pass http://$notif_upstream;
            include /etc/nginx/proxy.conf;
        }

        # ---------- security-audit-service (solo lectura desde fuera) ----------
        # La escritura de eventos (POST /eventos) solo ocurre por la red interna
        # entre microservicios con JWT de servicio.
        location /api/auditoria/ {
            limit_req zone=global burst=80 nodelay;
            limit_except GET { deny all; }
            set $audit_upstream security-audit-service:8086;
            rewrite ^/api/auditoria/(.*)$ /$1 break;
            proxy_pass http://$audit_upstream;
            include /etc/nginx/proxy.conf;
        }

        # ---------- Frontend ----------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. {
            deny all;
        }
    }
}
